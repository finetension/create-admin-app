name: Application Destroy

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Narrow production operation
        required: true
        type: choice
        options:
          - destroy
      confirmation:
        description: Exact project slug
        required: true
        type: string
      include_data:
        description: Also delete D1 and Access role memberships without recovery guarantees
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  maintain:
    if: github.repository != 'finetension/create-admin-app' && !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require main and the destroy capability
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            printf 'Application Destroy can only run from main: %s\n' "$GITHUB_REF" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" || "$OPERATION" != "destroy" ]]; then
            printf 'Only workflow_dispatch destroy is supported\n' >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Destroy selected Cloudflare resources
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLATFORM_ALLOW_DESTROY: "1"
          CONFIRMATION: ${{ inputs.confirmation }}
          INCLUDE_DATA: ${{ inputs.include_data }}
        run: |
          set -euo pipefail
          args=(internal destroy --confirm "$CONFIRMATION" --json)
          if [[ "$INCLUDE_DATA" == "true" ]]; then
            args+=(--include-data)
          fi
          pnpm cli "${args[@]}"
      - name: Commit the lifecycle transition
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- infra/lifecycle.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- infra/lifecycle.json
          git commit -m "chore(infra): mark production destroyed"
          git push origin HEAD:main
