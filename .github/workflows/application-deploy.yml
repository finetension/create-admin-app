name: Application Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository != 'finetension/create-admin-app' && !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require the production branch and supported event
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            printf 'Production can only deploy from main: %s\n' "$GITHUB_REF" >&2
            exit 1
          fi
          case "$GITHUB_EVENT_NAME" in
            push|workflow_dispatch) ;;
            *)
              printf 'Unsupported deploy event: %s\n' "$GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate without production credentials
        run: pnpm check
      - name: Deploy, migrate, protect, and smoke-check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLATFORM_ALLOW_DEPLOY: "1"
        run: node ./dist/cli/index.mjs internal deploy --json
      - name: Commit the lifecycle transition
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- infra/lifecycle.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- infra/lifecycle.json
          git commit -m "chore(infra): mark production deployed"
          git push origin HEAD:main
