name: Package CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: generator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-project:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generator:check
      - name: Create an independent project from the package archive
        shell: bash
        run: |
          set -euo pipefail
          test_root="$(mktemp -d)"
          generated_project="$test_root/generated-admin"
          package_output="$test_root/package"
          mkdir -p "$package_output"
          pnpm --filter @finetension/create-admin-app pack \
            --pack-destination "$package_output"
          package_archive="$(find "$package_output" -maxdepth 1 -name '*.tgz' -print -quit)"
          pnpm dlx "$package_archive" "$generated_project" \
            --json \
            --name "Generated Admin" \
            --owner-email "admin@example.com"
          cd "$generated_project"
          test -f .gitignore
          test -f config.toml
          test -f pnpm-lock.yaml
          test ! -e packages
          test ! -e deploy.config.json
          test ! -e backups
          test -e .github/workflows/application-ci.yml
          test -e .github/workflows/application-deploy.yml
          test -e .github/workflows/application-destroy.yml
          test ! -e .github/workflows/package-ci.yml
          test ! -e .github/workflows/package-publish.yml
          test ! -e docs/handbook/publishing.md
          test ! -e src/cli/deployment/package-workflow-policy.test.ts
          git ls-files --error-unmatch config.toml
          test "$(git rev-list --count HEAD)" = "1"
          test -z "$(git status --porcelain)"
